<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラッピングトレーニング進捗トラッカー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 24px 16px;
  }

  h1 {
    font-size: 18px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }

  /* ── 上部をカードと同じ幅で中央にそろえる ── */
  h1, .subtitle, .summary, .sum-bar, .selector {
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ── 構成サマリー ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 680px;
    margin-bottom: 8px;
  }
  .sum-box {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .sum-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .sum-val { font-size: 22px; font-weight: 500; }
  .sum-val small { font-size: 12px; font-weight: 400; margin-left: 2px; }
  .sum-names { font-size: 10px; color: #888; margin-top: 4px; line-height: 1.5; }
  .sum-box.main { background: #FFF1E6; border-color: #F5B98C; }
  .sum-box.main .sum-label, .sum-box.main .sum-val { color: #C9560F; }
  .sum-box.sub { background: #FFF9D9; border-color: #F5D766; }
  .sum-box.sub .sum-label, .sum-box.sub .sum-val { color: #7A6A00; }
  .sum-bar {
    display: flex;
    height: 10px;
    max-width: 680px;
    border-radius: 6px;
    overflow: hidden;
    background: #e8e8e6;
    margin-bottom: 20px;
  }
  .sum-bar div {
    height: 100%;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media (max-width: 480px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── セレクター ── */
  .selector {
    max-width: 680px;
    margin-bottom: 20px;
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px 14px 4px;
  }

  .sel-group { margin-bottom: 10px; }

  .sel-group-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: #555;
    margin-bottom: 6px;
  }

  .sel-group-title .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
  }

  .sel-group-title .count { color: #aaa; font-weight: 400; }

  .sel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 6px;
  }

  .sel-empty { font-size: 11px; color: #bbb; padding: 2px 0 6px; }

  .sel-btn {
    width: 100%;
    white-space: nowrap;
    padding: 8px 6px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
    font-weight: 400;
    transition: all 0.15s;
  }

  .sel-btn:hover { background: #f0f0f0; }

  .sel-btn.active {
    border: 2px solid #1D9E75;
  font-weight: 500;
}

  /* ── カード ── */
  .card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #E1F5EE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #0F6E56;
    flex-shrink: 0;
  }

  .person-name { font-size: 17px; font-weight: 500; }
  .person-status { font-size: 12px; color: #888; margin-top: 2px; }

  /* ── メトリクス ── */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .metric {
    background: #f7f7f5;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .metric-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
  }

  .metric-val {
    font-size: 22px;
    font-weight: 500;
    color: #1a1a1a;
  }

  .metric-val.green { color: #0F6E56; }

  /* ── ゲージ ── */
  .gauge-section { margin-bottom: 16px; }

  .gauge-row { margin-bottom: 8px; }

  .gauge-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .gauge-outer {
    height: 24px;
    background: #f0f0ee;
    border-radius: 8px;
    overflow: hidden;
  }

  .gauge-inner {
    height: 100%;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding-left: 10px;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    transition: width 0.5s ease;
    min-width: 0;
  }

  /* ── ステップグリッド ── */
  .divider {
    height: 1px;
    background: #f0f0ee;
    margin: 16px 0;
  }

  .steps-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .steps-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  @media (max-width: 480px) {
    .steps-grid { grid-template-columns: repeat(2, 1fr); }
    .metrics { grid-template-columns: repeat(3, 1fr); }
  }

  .step-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    transition: all 0.15s;
  }

  .step-item:hover { background: #fafafa; }

  .step-item.done {
    background: #E1F5EE;
    border-color: #9FE1CB;
  }

  .step-check {
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 4px;
    border: 1.5px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    margin-top: 1px;
  }

  .step-item.done .step-check {
    background: #1D9E75;
    border-color: #1D9E75;
  }

  .step-body { flex: 1; min-width: 0; }

  .step-text {
    font-size: 12px;
    color: #1a1a1a;
    line-height: 1.4;
  }

  .step-item.done .step-text { color: #0F6E56; }

  .step-hours {
    font-size: 10px;
    color: #aaa;
    margin-top: 2px;
  }

  .step-item.done .step-hours { color: #1D9E75; }

  .step-date {
    font-size: 10px;
    color: #0F6E56;
    font-weight: 500;
    margin-top: 2px;
  }
  .step-date.none { color: #aaa; font-weight: 400; }

  .tooltip-wrap { position: relative; }
  .tooltip-box {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    font-size: 11px;
    line-height: 1.5;
    padding: 7px 10px;
    border-radius: 8px;
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .tooltip-box::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #1a1a1a;
  }
  .tooltip-label {
    font-size: 10px;
    color: #FFF3B0;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .step-item:hover .tooltip-box { display: block; }

  /* ── フッター ── */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #bbb;
    margin-top: 20px;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }

  .print-btn {
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    border: 1.5px solid #1a1a1a;
    background: #fff;
    color: #7A6A00;
    cursor: pointer;
    transition: all 0.15s;
  }
  .print-btn:hover { background: #7A6A00; color: #fff; }

  @media print {
    body { background: #fff; padding: 0; }
    .selector { display: none !important; }
    .save-btn, .reset-btn, .print-bar, #save-btn, #save-status, .lock-bar { display: none !important; }
    .card { border: none; box-shadow: none; max-width: 100%; page-break-inside: avoid; }
    .steps-grid { grid-template-columns: repeat(2, 1fr); }
    .print-all-cards { display: block !important; }
    .single-card { display: none !important; }
  }
.gauge-outer {
  border: 1px solid #ccc !important;
}

.gauge-inner {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}
  /* ── リセットボタン ── */
  .reset-btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
    color: #888;
    cursor: pointer;
    float: right;
  }

  .reset-btn:hover { color: #E24B4A; border-color: #E24B4A; }
  .reset-btn:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }

  /* ── ロックボタン ── */
  .lock-btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    border: 1.5px solid #555;
    background: #555;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .lock-btn:hover { opacity: 0.85; }
  .lock-btn.unlocked {
    background: #fff;
    border-color: #E8681A;
    color: #E8681A;
  }
  .lock-hint { flex: 1 1 200px; font-size: 11px; color: #999; line-height: 1.5; }
  .lock-hint.unlocked { color: #E8681A; }
  .step-item.locked { cursor: default; }
  .step-item.locked:hover { background: #E1F5EE; }

  .save-btn {
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    border: none;
    background: #E8681A;
    color: #fff;
    cursor: pointer;
    transition: all 0.15s;
  }
  .save-btn:hover { background: #C9560F; }
  .save-btn:disabled { background: #ccc; cursor: default; }
  .save-status {
    font-size: 12px;
    color: #888;
    margin-left: 8px;
  }
  .save-status.ok { color: #1D9E75; }
  .save-status.err { color: #E24B4A; }
</style>
</head>
<body>

<h1>ラッピングトレーニング進捗トラッカー</h1>
<p class="subtitle">チェックを押すと進捗が保存されます</p>

<div class="summary" id="summary"></div>
<div class="sum-bar" id="sum-bar"></div>

<div class="selector" id="selector"></div>

<div class="card" id="card"></div>

<div class="print-bar" style="max-width:680px;margin:16px auto;display:flex;gap:8px;align-items:center;">
  <button class="print-btn" onclick="printCurrent()">📄 この画面をPDF保存</button>
  <button class="print-btn" onclick="printAll()">📋 全員分をPDF保存</button>
</div>
<p class="footer">データはGoogleスプレッドシートに自動保存されます　|　<a href="https://docs.google.com/spreadsheets/d/1qDKYvWaq6q4iuQiZMlXOdiP7BFmEfRqGsKYEE-nJ1gM/edit" target="_blank" style="color:#E8681A;">📊 スプレッドシートを開く</a></p>

<script>
const STEPS = [
  { label: 'STEP1：全回転',         hours: 4, cat: '基礎',   sub: true,  pass: '全回転で出荷出来るレベル' },
  { label: 'STEP2：半回転',         hours: 4, cat: '基礎',   sub: true,  pass: '半回転で出荷出来るレベル' },
  { label: 'STEP3：色々な四角',      hours: 2, cat: '基礎',   sub: false, pass: 'スイマーバ、ビーボックスなどが出荷出来るレベル' },
  { label: 'STEP4：キャラメル',      hours: 1, cat: '応用',   sub: true,  pass: 'アップリカお風呂などが出荷出来るレベル' },
  { label: 'STEP5：巻き・リボン',    hours: 1, cat: '応用',   sub: true,  pass: '商品に合わせて巻き・リボンWが出来る' },
  { label: 'STEP6：ストッケ',        hours: 4, cat: '特殊',   sub: true,  pass: '本体・ベビーセット・トレイが出荷出来るレベル' },
  { label: 'STEP7：変形',           hours: 3, cat: '特殊',   sub: false, pass: '四角ではないものも臨機応変に巻ける' },
  { label: 'STEP8：タイム研修',      hours: 4, cat: 'タイム', sub: false, pass: '四角は1分台、ラキューは1分切る、キャラメルは5分以内' },
  { label: 'STEP9：タブレット・フロー', hours: 1, cat: 'その他', sub: false, pass: 'STEP9研修項目全てにチェックが入る' },
];

// サブ条件：STEP1・2・4・5・6（index 0,1,3,4,5）が全て完了
const SUB_INDICES = [0, 1, 3, 4, 5];

const TARGET = 24;

const DEFAULT_PEOPLE = [
  { name: '熊元',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '山崎',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '高瀬',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '右幸',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '山田',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '木下',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '広瀬',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '黒木',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '中村',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '田中',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '福田',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '荒井',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '小林舞奈', status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '向井',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '平田',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '細田',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '岩田',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
  { name: '三山',  status: '', checks: [0,0,0,0,0,0,0,0,0,] },
];
// ── GAS連携設定 ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzW6qSWlPgFish_sdpbi0pDod-nUmBWwR90yvRi8dZMKSMdVFX24ewEtpzgwyzlGCxx/exec';

// 初期stateはデフォルト（GASから上書き）
function loadState() {
  return DEFAULT_PEOPLE.map(p => ({ ...p, checks: [...p.checks], dates: STEPS.map(() => '') }));
}

// GASからデータ読み込み（JSONP方式）
function loadFromGAS() {
  showLoading(true);
  window._gasCallback = function(json) {
    if (json.data && json.data.length > 0) {
      json.data.forEach(row => {
        const idx = state.findIndex(p => p.name === row.name);
        if (idx >= 0) {
          state[idx].checks = row.checks;
          const d = Array.isArray(row.dates) ? row.dates : [];
          state[idx].dates = STEPS.map((_, i) => d[i] || '');
        }
      });
    }
    showLoading(false);
    render();
  };
  const script = document.createElement('script');
  script.src = GAS_URL + '?action=load&callback=_gasCallback&t=' + Date.now();
  script.onerror = () => { showLoading(false); render(); };
  document.body.appendChild(script);
}

// GASに保存（チェックするたびに自動で保存）
function saveToGAS() {
  const p = state[current];
  const status = document.getElementById('save-status');
  if (status) { status.textContent = '保存中...'; status.className = 'save-status'; }

  window._gasSaveCallback = function(json) {
    const status = document.getElementById('save-status');
    if (json && json.ok) {
      if (status) { status.textContent = '✓ 保存しました'; status.className = 'save-status ok'; }
      setTimeout(() => { if (status) status.textContent = ''; }, 3000);
    } else {
      if (status) { status.textContent = '✗ 保存失敗'; status.className = 'save-status err'; }
    }
  };

  const data = encodeURIComponent(JSON.stringify({ action: 'save', name: p.name, checks: p.checks, dates: p.dates }));
  const script = document.createElement('script');
  script.src = GAS_URL + '?callback=_gasSaveCallback&data=' + data + '&t=' + Date.now();
  document.body.appendChild(script);
}

function saveState() {} // チェック時は自動保存しない

function showLoading(on) {
  let el = document.getElementById('loading-bar');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loading-bar';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;height:3px;background:#E8681A;z-index:999;transition:opacity 0.3s';
    document.body.prepend(el);
  }
  el.style.opacity = on ? '1' : '0';
}

// ── 完了日 ──
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function shortDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return (y === new Date().getFullYear() ? '' : y + '/') + m + '/' + d;
}
function dateLabel(p, i) {
  if (!p.checks[i]) return '';
  return p.dates && p.dates[i] ? shortDate(p.dates[i]) + ' 完了' : '完了日なし';
}

const state = loadState();
let unlocked = false; // false = ロック中（チェックを外せない）
let current = 0;

// ── 計算 ──
function totalHours(checks) {
  return STEPS.reduce((s, st, i) => s + (checks[i] ? st.hours : 0), 0);
}

function doneCount(checks) {
  return checks.reduce((a, b) => a + b, 0);
}

function gaugeColor(pct) {
  if (pct >= 100) return '#1D9E75';
  if (pct >= 60)  return '#378ADD';
  if (pct >= 30)  return '#BA7517';
  return '#B4B2A9';
}

// ── 描画 ──
function render() {
  renderSummary();

  // セレクターボタン（メイン達成・サブ達成・研修中に分けて表示）
  const sel = document.getElementById('selector');
  sel.innerHTML = '';
  const groups = [
    { key: 'main',     label: 'メイン達成', dot: '#E8681A', members: [] },
    { key: 'sub',      label: 'サブ達成',   dot: '#F5D766', members: [] },
    { key: 'training', label: '研修中',     dot: '#fff',    members: [] },
  ];
  state.forEach((p, i) => {
    const subOk  = SUB_INDICES.every(j => p.checks[j] === 1);
    const mainOk = Math.min(100, Math.round(totalHours(p.checks) / TARGET * 100)) >= 100;
    const g = mainOk ? groups[0] : subOk ? groups[1] : groups[2];
    g.members.push(i);
  });

  groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'sel-group';
    wrap.innerHTML = `
      <div class="sel-group-title">
        <span class="dot" style="background:${g.dot};border-color:${g.dot === '#fff' ? '#ccc' : g.dot}"></span>
        ${g.label}<span class="count">${g.members.length}人</span>
      </div>`;
    if (g.members.length === 0) {
      wrap.innerHTML += '<div class="sel-empty">該当なし</div>';
      sel.appendChild(wrap);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'sel-grid';
    g.members.forEach(i => {
      const p = state[i];
      const btn = document.createElement('button');
      btn.className = 'sel-btn' + (i === current ? ' active' : '');

      if (g.key === 'main') {
        btn.style.background = '#E8681A';
        btn.style.borderColor = '#E8681A';
        btn.style.color = '#fff';
      } else if (g.key === 'sub') {
        btn.style.background = '#FFF3B0';
        btn.style.borderColor = '#F5D766';
        btn.style.color = '#7A6A00';
      }

      if (i === current) {
        btn.style.borderColor = '#1D9E75';
        btn.style.borderWidth = '2px';
      }

      btn.textContent = p.name;
      btn.onclick = () => { current = i; unlocked = false; render(); };
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    sel.appendChild(wrap);
  });

  const p = state[current];
  const hours   = totalHours(p.checks);
  const done    = doneCount(p.checks);
  const timePct = Math.min(100, Math.round(hours / TARGET * 100));
  const stepPct = Math.round(done / STEPS.length * 100);
  const tColor  = gaugeColor(timePct);
  const sColor  = gaugeColor(stepPct);

  // サブ・メイン達成判定
  const isSubOk  = SUB_INDICES.every(i => p.checks[i] === 1);
  const isMainOk = timePct >= 100;
  const badgeHtml = isMainOk
    ? '<span style="background:#E1F5EE;color:#0F6E56;border:1px solid #9FE1CB;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;">✓ メイン達成</span>'
    : isSubOk
    ? '<span style="background:#E6F1FB;color:#185FA5;border:1px solid #A8CDED;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;">✓ サブ達成</span>'
    : '<span style="background:#f5f5f3;color:#aaa;border:1px solid #e0e0e0;font-size:11px;padding:3px 10px;border-radius:20px;">研修中</span>';

  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="card-header">
      <div class="avatar">${p.name[0]}</div>
      <div style="flex:1">
        <div class="person-name">${p.name}さん &nbsp;${badgeHtml}</div>
        <div class="person-status" style="margin-top:4px">サブ条件：STEP1・2・4・5・6 完了 ／ メイン条件：全STEP完了</div>
      </div>
      <button class="reset-btn" id="reset-btn" ${unlocked ? '' : 'disabled title="ロックを解除すると使えます"'}>リセット</button>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">累計時間</div>
        <div class="metric-val${timePct >= 100 ? ' green' : ''}">${hours}h</div>
      </div>
      <div class="metric">
        <div class="metric-label">達成率</div>
        <div class="metric-val${timePct >= 100 ? ' green' : ''}">${timePct}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">完了ステップ</div>
        <div class="metric-val">${done} / ${STEPS.length}</div>
      </div>
    </div>

    <div class="gauge-section">
      <div class="gauge-row">
        <div class="gauge-label">
          <span>時間進捗（目標 ${TARGET}h）</span>
          <span>${hours}h / ${TARGET}h</span>
        </div>
        <div class="gauge-outer">
          <div class="gauge-inner" style="width:${timePct}%; background:${tColor}">
            ${timePct >= 18 ? timePct + '%' : ''}
          </div>
        </div>
      </div>
      <div class="gauge-row">
        <div class="gauge-label">
          <span>ステップ進捗（全${STEPS.length}項目）</span>
          <span>${done} / ${STEPS.length}</span>
        </div>
        <div class="gauge-outer">
          <div class="gauge-inner" style="width:${stepPct}%; background:${sColor}">
            ${stepPct >= 18 ? stepPct + '%' : ''}
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="lock-bar" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px;">
      <button class="lock-btn${unlocked ? ' unlocked' : ''}" id="lock-btn">${unlocked ? '🔓 ロック解除中' : '🔒 ロック中'}</button>
      <span class="lock-hint${unlocked ? ' unlocked' : ''}">${unlocked
        ? 'チェックを外せます。終わったらボタンを押してロックしてください'
        : 'チェックの追加のみできます。外すときはロックを解除してください'}</span>
      <span class="save-status" id="save-status" style="margin-left:auto;white-space:nowrap;"></span>
    </div>
    <div class="steps-title">トレーニングステップ — クリックで完了（チェックは自動で保存されます）</div>
    <div class="steps-grid" id="steps-grid"></div>
  `;

  // ロック / ロック解除
  card.querySelector('#lock-btn').onclick = () => {
    unlocked = !unlocked;
    render();
  };

  // リセットボタン（ロック解除中のみ）
  card.querySelector('#reset-btn').onclick = () => {
    if (!unlocked) return;
    if (confirm(p.name + 'さんの進捗をリセットしますか？')) {
      state[current].checks = new Array(STEPS.length).fill(0);
      state[current].dates = STEPS.map(() => '');
      render();
saveToGAS();
    }
  };

  // ステップ
  const grid = card.querySelector('#steps-grid');
  STEPS.forEach((st, i) => {
    const isSub = SUB_INDICES.includes(i);
    const item = document.createElement('div');
    item.className = 'step-item tooltip-wrap' + (p.checks[i] ? ' done' : '') + (p.checks[i] && !unlocked ? ' locked' : '');
    const subTag = isSub
      ? '<span style="font-size:9px;background:#FFF3CD;color:#856404;border:1px solid #FFEAA7;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;">サブ必須</span>'
      : '';
    item.innerHTML = `
      <div class="tooltip-box">
        <div class="tooltip-label">合格ライン</div>
        ${st.pass}
      </div>
      <div class="step-check">${p.checks[i] ? '✓' : ''}</div>
      <div class="step-body">
        <div class="step-text">${st.label}${subTag}</div>
        <div class="step-hours">${st.hours}h</div>
        ${p.checks[i] ? `<div class="step-date${p.dates[i] ? '' : ' none'}">${dateLabel(p, i)}</div>` : ''}
      </div>
    `;
    item.onclick = () => {
  // ロック中は、チェック済みのものを外せない
  if (state[current].checks[i] && !unlocked) {
    const status = document.getElementById('save-status');
    if (status) {
      status.textContent = '🔒 ロック中は外せません';
      status.className = 'save-status err';
      setTimeout(() => { if (status) status.textContent = ''; }, 2500);
    }
    return;
  }
  state[current].checks[i] =
    state[current].checks[i] ? 0 : 1;
  state[current].dates[i] =
    state[current].checks[i] ? todayStr() : '';
  render();
  saveToGAS();
};
    grid.appendChild(item);
  });
}

// ── 構成サマリー（メイン・サブ・研修中の人数） ──
function renderSummary() {
  const main = [], sub = [], training = [];
  state.forEach(p => {
    const mainOk = Math.min(100, Math.round(totalHours(p.checks) / TARGET * 100)) >= 100;
    const subOk  = SUB_INDICES.every(j => p.checks[j] === 1);
    if (mainOk) main.push(p.name);
    else if (subOk) sub.push(p.name);
    else training.push(p.name);
  });
  const total = state.length;

  const box = (cls, label, names, showNames) => `
    <div class="sum-box ${cls}">
      <div class="sum-label">${label}</div>
      <div class="sum-val">${names.length}<small>人</small></div>
      ${showNames ? `<div class="sum-names">${names.map(n => `<span style="white-space:nowrap">${n}</span>`).join('・') || '—'}</div>` : ''}
    </div>`;

  document.getElementById('summary').innerHTML = `
    <div class="sum-box">
      <div class="sum-label">登録人数</div>
      <div class="sum-val">${total}<small>人</small></div>
    </div>
    ${box('main', 'メイン達成', main, false)}
    ${box('sub', 'サブ達成', sub, false)}
    ${box('', '研修中', training, false)}
  `;

  const pct = n => total ? (n / total * 100) : 0;
  document.getElementById('sum-bar').innerHTML = `
    <div style="width:${pct(main.length)}%;background:#E8681A" title="メイン達成 ${main.length}人"></div>
    <div style="width:${pct(sub.length)}%;background:#F5D766" title="サブ達成 ${sub.length}人"></div>
  `;
}

// 現在の人だけ印刷
function printCurrent() {
  window.print();
}

  let html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
  <title>トレーニング進捗 全員分</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif; padding: 16px; color: #1a1a1a; }
    h1 { font-size: 16px; margin-bottom: 16px; border-bottom: 2px solid #1a1a1a; padding-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 16px; page-break-inside: avoid; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #E1F5EE; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #0F6E56; flex-shrink:0; }
    .name { font-size: 15px; font-weight: 500; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
    .badge-main { background: #FFE4CC; color: #C9560F; }
    .badge-sub { background: #FFF9CC; color: #856404; }
    .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
    .metric { background: #f7f7f5; border-radius: 6px; padding: 8px 10px; }
    .metric-label { font-size: 10px; color
    #888; margin-bottom: 2px; }
    .metric-val { font-size: 18px; font-weight: 500; }
    .gauge-outer { height: 16px; background: #f0f0ee; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
    .gauge-inner { height: 100%; border-radius: 6px; display:flex; align-items:center; padding-left:6px; font-size:10px; color:#fff; font-weight:500; }
    .steps-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; margin-top: 8px; }
    .step { padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 11px; }
    .step.done { background: #E1F5EE; border-color: #9FE1CB; color: #0F6E56; }
    .step .check { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; margin-right: 4px; vertical-align: middle; text-align:center; line-height:14px; font-size:10px; }
    .step.done .check { background: #1D9E75; border-color: #1D9E75; color:#fff; }
    .divider { height:1px; background:#eee; margin: 8px 0; }
    .gauge-label { font-size:11px; color:#888; margin-bottom:3px; display:flex; justify-content:space-between; }
  </style></head><body>
  <h1>ラッピングトレーニング進捗　全員分</h1>`;

  state.forEach(p => {
    const hours = STEPS.reduce((s,st,i) => s+(p.checks[i]?st.hours:0), 0);
    const done  = p.checks.reduce((a,b)=>a+b,0);
    const timePct = Math.min(100, Math.round(hours/TARGET*100));
    const stepPct = Math.round(done/STEPS.length*100);
    const isMainOk = timePct >= 100;
    const isSubOk  = SUB_INDICES.every(i => p.checks[i] === 1);
    const badgeHtml = isMainOk
      ? '<span class="badge badge-main">メイン達成</span>'
      : isSubOk ? '<span class="badge badge-sub">サブ達成</span>' : '';

    function gc(pct){ return pct>=100?'#1D9E75':pct>=60?'#378ADD':pct>=30?'#BA7517':'#B4B2A9'; }

    html += `<div class="card">
      <div class="card-header">
        <div class="avatar">${p.name[0]}</div>
        <div><span class="name">${p.name}さん</span>${badgeHtml}</div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="metric-label">累計時間</div><div class="metric-val">${hours}h</div></div>
        <div class="metric"><div class="metric-label">達成率</div><div class="metric-val">${timePct}%</div></div>
        <div class="metric"><div class="metric-label">完了ステップ</div><div class="metric-val">${done}/${STEPS.length}</div></div>
      </div>
      <div class="gauge-label"><span>時間進捗（目標${TARGET}h）</span><span>${hours}h/${TARGET}h</span></div>
      <div class="gauge-outer"><div class="gauge-inner" style="width:${timePct}%;background:${gc(timePct)}">${timePct>=18?timePct+'%':''}</div></div>
      <div class="gauge-label"><span>ステップ進捗</span><span>${done}/${STEPS.length}</span></div>
      <div class="gauge-outer"><div class="gauge-inner" style="width:${stepPct}%;background:${gc(stepPct)}">${stepPct>=18?stepPct+'%':''}</div></div>
      <div class="divider"></div>
      <div class="steps-grid">`;

    STEPS.forEach((st,i) => {
      html += `<div class="step${p.checks[i]?' done':''}">
        <span class="check">${p.checks[i]?'✓':''}</span>${st.label}${p.checks[i] && p.dates[i] ? `<span style="float:right;font-size:10px;">${shortDate(p.dates[i])}</span>` : ''}
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `</body></html>`;
  printWin.document.write(html);
  printWin.document.close();
  printWin.focus();
  setTimeout(() => printWin.print(), 500);
}

loadFromGAS();
  jsonp(
    GAS_URL + '?action=summary',

</script>
